<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#1a1a2e"/>

  <!-- Document (left side) -->
  <g transform="translate(60, 80)">
    <!-- Paper shadow -->
    <rect x="8" y="8" width="180" height="230" rx="6" fill="#0d0d1a" opacity="0.5"/>
    <!-- Paper -->
    <rect width="180" height="230" rx="6" fill="#f0f0f0"/>
    <!-- Fold corner -->
    <polygon points="140,0 180,0 180,40" fill="#d0d0d0"/>
    <polygon points="140,0 140,40 180,40" fill="#e0e0e0"/>
    <!-- Text lines -->
    <rect x="20" y="30" width="100" height="10" rx="2" fill="#cccccc"/>
    <rect x="20" y="50" width="140" height="7" rx="2" fill="#dddddd"/>
    <rect x="20" y="65" width="130" height="7" rx="2" fill="#dddddd"/>
    <rect x="20" y="80" width="140" height="7" rx="2" fill="#dddddd"/>
    <rect x="20" y="95" width="110" height="7" rx="2" fill="#dddddd"/>
    <rect x="20" y="120" width="140" height="7" rx="2" fill="#dddddd"/>
    <rect x="20" y="135" width="125" height="7" rx="2" fill="#dddddd"/>
    <rect x="20" y="150" width="140" height="7" rx="2" fill="#dddddd"/>
    <rect x="20" y="165" width="90" height="7" rx="2" fill="#dddddd"/>

    <!-- Orange dotted corner detection border -->
    <!-- Top-left corner -->
    <rect x="-10" y="-10" width="30" height="4" rx="2" fill="#ff6333"/>
    <rect x="-10" y="-10" width="4" height="30" rx="2" fill="#ff6333"/>
    <circle cx="-10" cy="-10" r="5" fill="#ff6333"/>

    <!-- Top-right corner -->
    <rect x="160" y="-10" width="30" height="4" rx="2" fill="#ff6333"/>
    <rect x="186" y="-10" width="4" height="30" rx="2" fill="#ff6333"/>
    <circle cx="190" cy="-10" r="5" fill="#ff6333"/>

    <!-- Bottom-left corner -->
    <rect x="-10" y="236" width="30" height="4" rx="2" fill="#ff6333"/>
    <rect x="-10" y="206" width="4" height="30" rx="2" fill="#ff6333"/>
    <circle cx="-10" cy="240" r="5" fill="#ff6333"/>

    <!-- Bottom-right corner -->
    <rect x="160" y="236" width="30" height="4" rx="2" fill="#ff6333"/>
    <rect x="186" y="206" width="4" height="30" rx="2" fill="#ff6333"/>
    <circle cx="190" cy="240" r="5" fill="#ff6333"/>

    <!-- Dotted lines between corners (top) -->
    <line x1="25" y1="-8" x2="158" y2="-8" stroke="#ff6333" stroke-width="2" stroke-dasharray="6,5" opacity="0.7"/>
    <!-- Bottom -->
    <line x1="25" y1="238" x2="158" y2="238" stroke="#ff6333" stroke-width="2" stroke-dasharray="6,5" opacity="0.7"/>
    <!-- Left -->
    <line x1="-8" y1="25" x2="-8" y2="208" stroke="#ff6333" stroke-width="2" stroke-dasharray="6,5" opacity="0.7"/>
    <!-- Right -->
    <line x1="188" y1="25" x2="188" y2="208" stroke="#ff6333" stroke-width="2" stroke-dasharray="6,5" opacity="0.7"/>
  </g>

  <!-- Smartphone (right side) -->
  <g transform="translate(330, 60)">
    <!-- Phone shadow -->
    <rect x="8" y="8" width="160" height="280" rx="20" fill="#0d0d1a" opacity="0.6"/>
    <!-- Phone body -->
    <rect width="160" height="280" rx="20" fill="#2d2d45"/>
    <rect x="2" y="2" width="156" height="276" rx="18" fill="#252538"/>

    <!-- Screen -->
    <rect x="10" y="30" width="140" height="210" rx="8" fill="#1a1a2e"/>

    <!-- Camera viewfinder on screen -->
    <rect x="15" y="35" width="130" height="200" rx="5" fill="#0d0d1a"/>

    <!-- Viewfinder content - showing document in camera view -->
    <rect x="30" y="65" width="100" height="130" rx="4" fill="#1e1e30" opacity="0.7"/>
    <rect x="38" y="78" width="60" height="5" rx="2" fill="#555577"/>
    <rect x="38" y="90" width="84" height="4" rx="2" fill="#444466"/>
    <rect x="38" y="101" width="80" height="4" rx="2" fill="#444466"/>
    <rect x="38" y="112" width="84" height="4" rx="2" fill="#444466"/>

    <!-- Corner guides in viewfinder -->
    <rect x="25" y="58" width="20" height="3" rx="1" fill="#ff6333"/>
    <rect x="25" y="58" width="3" height="20" rx="1" fill="#ff6333"/>
    <rect x="115" y="58" width="20" height="3" rx="1" fill="#ff6333"/>
    <rect x="132" y="58" width="3" height="20" rx="1" fill="#ff6333"/>
    <rect x="25" y="202" width="20" height="3" rx="1" fill="#ff6333"/>
    <rect x="25" y="185" width="3" height="20" rx="1" fill="#ff6333"/>
    <rect x="115" y="202" width="20" height="3" rx="1" fill="#ff6333"/>
    <rect x="132" y="185" width="3" height="20" rx="1" fill="#ff6333"/>

    <!-- Horizontal scan line -->
    <line x1="15" y1="145" x2="145" y2="145" stroke="#ff6333" stroke-width="1.5" opacity="0.8" stroke-dasharray="3,2"/>

    <!-- Camera circle at top of phone -->
    <circle cx="80" cy="18" r="5" fill="#1a1a2e"/>
    <circle cx="80" cy="18" r="3" fill="#333355"/>

    <!-- Bottom home area -->
    <rect x="55" y="255" width="50" height="6" rx="3" fill="#444466"/>

    <!-- Capture button at bottom of screen -->
    <circle cx="80" cy="235" r="10" fill="#ff6333" opacity="0.9"/>
    <circle cx="80" cy="235" r="7" fill="none" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Arrow from phone to PDF output -->
  <g transform="translate(500, 165)">
    <path d="M0,0 L30,0" stroke="#ff9055" stroke-width="2.5" fill="none" stroke-dasharray="4,3"/>
    <polygon points="28,-5 40,0 28,5" fill="#ff9055"/>
  </g>

  <!-- PDF output icon -->
  <g transform="translate(545, 135)">
    <!-- PDF card shadow -->
    <rect x="4" y="4" width="48" height="62" rx="5" fill="#0d0d1a" opacity="0.5"/>
    <!-- PDF card -->
    <rect width="48" height="62" rx="5" fill="#ffffff"/>
    <!-- Fold corner -->
    <polygon points="33,0 48,0 48,15" fill="#e0e0e0"/>
    <polygon points="33,0 33,15 48,15" fill="#f0f0f0"/>
    <!-- Red PDF header -->
    <rect y="20" width="48" height="20" fill="#ff6333"/>
    <!-- PDF text -->
    <text x="24" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="10" fill="#ffffff">PDF</text>
    <!-- Lines below -->
    <rect x="6" y="47" width="36" height="3" rx="1" fill="#dddddd"/>
    <rect x="6" y="54" width="28" height="3" rx="1" fill="#dddddd"/>
  </g>

  <!-- Title text -->
  <text x="300" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">Scan &amp; Convert Documents to PDF</text>
  <text x="300" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#888899">PDFdukan Scanner — Instant mobile scanning</text>
</svg>
