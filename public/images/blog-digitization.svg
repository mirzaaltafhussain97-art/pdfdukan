<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <!-- Background -->
  <rect width="800" height="400" fill="#1a1a2e"/>

  <!-- Divider line (subtle) -->
  <line x1="400" y1="40" x2="400" y2="360" stroke="#333355" stroke-width="1" stroke-dasharray="5,5"/>

  <!-- ===== LEFT HALF: Physical world ===== -->
  <!-- Label -->
  <text x="200" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#666688">Physical Documents</text>

  <!-- Filing cabinet (back) -->
  <g transform="translate(50, 120)">
    <rect width="110" height="200" rx="4" fill="#2a2a42"/>
    <rect x="0" y="0" width="110" height="65" rx="4" fill="#333355"/>
    <rect x="0" y="67" width="110" height="65" rx="0" fill="#2e2e4a"/>
    <rect x="0" y="134" width="110" height="66" rx="4" fill="#282840"/>
    <!-- Drawer handles -->
    <rect x="35" y="28" width="40" height="8" rx="4" fill="#444466"/>
    <rect x="35" y="95" width="40" height="8" rx="4" fill="#444466"/>
    <rect x="35" y="162" width="40" height="8" rx="4" fill="#444466"/>
    <!-- Label slots -->
    <rect x="15" y="18" width="80" height="10" rx="2" fill="#1e1e30"/>
    <rect x="15" y="85" width="80" height="10" rx="2" fill="#1e1e30"/>
    <rect x="15" y="152" width="80" height="10" rx="2" fill="#1e1e30"/>
  </g>

  <!-- Main manila folder -->
  <g transform="translate(150, 130)">
    <!-- Folder back -->
    <rect width="160" height="180" rx="6" fill="#c8952a"/>
    <!-- Folder tab -->
    <rect x="10" y="-18" width="80" height="22" rx="4" fill="#c8952a"/>
    <rect x="10" y="-18" width="80" height="22" rx="4" fill="none" stroke="#b07820" stroke-width="1"/>
    <!-- Folder body shading -->
    <rect x="0" y="0" width="160" height="180" rx="6" fill="none" stroke="#b07820" stroke-width="1"/>
    <!-- Folder inner (lighter) -->
    <rect x="8" y="8" width="144" height="164" rx="4" fill="#d4a030" opacity="0.3"/>
    <!-- Label on tab -->
    <text x="50" y="-3" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7a5010">2024</text>
  </g>

  <!-- Papers sticking out of folder -->
  <!-- Paper 3 (back) -->
  <g transform="translate(158, 80) rotate(-6, 70, 0)">
    <rect width="140" height="170" rx="4" fill="#ececec"/>
    <rect x="10" y="20" width="80" height="7" rx="2" fill="#999"/>
    <rect x="10" y="32" width="110" height="5" rx="2" fill="#ccc"/>
    <rect x="10" y="42" width="105" height="5" rx="2" fill="#ccc"/>
    <rect x="10" y="52" width="110" height="5" rx="2" fill="#ccc"/>
  </g>
  <!-- Paper 2 -->
  <g transform="translate(164, 75) rotate(4, 70, 0)">
    <rect width="140" height="170" rx="4" fill="#f5f5f5"/>
    <rect x="10" y="20" width="90" height="8" rx="2" fill="#aaa"/>
    <rect x="10" y="33" width="115" height="5" rx="2" fill="#ddd"/>
    <rect x="10" y="43" width="100" height="5" rx="2" fill="#ddd"/>
    <rect x="10" y="53" width="115" height="5" rx="2" fill="#ddd"/>
  </g>
  <!-- Paper 1 (front) -->
  <g transform="translate(170, 70)">
    <rect width="140" height="175" rx="4" fill="#ffffff"/>
    <rect x="10" y="20" width="100" height="9" rx="2" fill="#ff6333" opacity="0.8"/>
    <rect x="10" y="35" width="115" height="5" rx="2" fill="#dddddd"/>
    <rect x="10" y="45" width="100" height="5" rx="2" fill="#eeeeee"/>
    <rect x="10" y="55" width="115" height="5" rx="2" fill="#dddddd"/>
    <rect x="10" y="65" width="85" height="5" rx="2" fill="#eeeeee"/>
  </g>

  <!-- Inbox tray overflowing -->
  <g transform="translate(48, 295)">
    <rect width="130" height="30" rx="3" fill="#333355"/>
    <rect x="-5" y="-40" width="80" height="45" rx="3" fill="#f5f5f5" transform="rotate(-15, 40, 0)"/>
    <rect x="15" y="-35" width="80" height="45" rx="3" fill="#ececec" transform="rotate(-5, 40, 0)"/>
    <rect x="25" y="-30" width="80" height="45" rx="3" fill="#ffffff" transform="rotate(5, 40, 0)"/>
    <text x="65" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#888899">INBOX</text>
  </g>

  <!-- ===== CURVED DOTTED ARROW from left to right ===== -->
  <path d="M360,200 Q400,130 440,200" stroke="#ff6333" stroke-width="3" fill="none" stroke-dasharray="8,5" stroke-linecap="round"/>
  <!-- Arrow head -->
  <polygon points="432,196 445,206 432,215" fill="#ff6333"/>

  <!-- Transform icon in center -->
  <circle cx="400" cy="185" r="22" fill="#ff6333" opacity="0.12"/>
  <text x="400" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#ff6333">→</text>

  <!-- ===== RIGHT HALF: Digital world ===== -->
  <!-- Label -->
  <text x="600" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#666688">Digital Organization</text>

  <!-- Laptop body -->
  <g transform="translate(430, 100)">
    <!-- Screen -->
    <rect width="280" height="180" rx="12" fill="#2d2d45"/>
    <rect x="4" y="4" width="272" height="172" rx="9" fill="#1a1a2e"/>

    <!-- Screen content: digital folder UI -->
    <!-- Top bar -->
    <rect x="4" y="4" width="272" height="22" rx="9" fill="#252538"/>
    <circle cx="18" cy="15" r="5" fill="#ff5555" opacity="0.7"/>
    <circle cx="32" cy="15" r="5" fill="#ffaa00" opacity="0.7"/>
    <circle cx="46" cy="15" r="5" fill="#44cc44" opacity="0.7"/>
    <text x="155" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#888899">PDFdukan Drive</text>

    <!-- Folder grid on screen -->
    <!-- Row 1 folders -->
    <g transform="translate(20, 35)">
      <!-- Folder 1 -->
      <rect y="-8" width="55" height="6" rx="3" fill="#ff9055" opacity="0.9"/>
      <rect y="0" width="55" height="45" rx="4" fill="#ff6333" opacity="0.75"/>
      <text x="27" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#fff">2024</text>
      <text x="27" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#ffcc99">12 files</text>
    </g>
    <g transform="translate(90, 35)">
      <rect y="-8" width="55" height="6" rx="3" fill="#9055ff" opacity="0.9"/>
      <rect y="0" width="55" height="45" rx="4" fill="#7733cc" opacity="0.75"/>
      <text x="27" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#fff">Invoices</text>
      <text x="27" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#ccaaff">8 files</text>
    </g>
    <g transform="translate(160, 35)">
      <rect y="-8" width="55" height="6" rx="3" fill="#55aaff" opacity="0.9"/>
      <rect y="0" width="55" height="45" rx="4" fill="#2266cc" opacity="0.75"/>
      <text x="27" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#fff">Reports</text>
      <text x="27" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#aaccff">5 files</text>
    </g>
    <g transform="translate(230, 35)">
      <rect y="-8" width="35" height="6" rx="3" fill="#ff9055" opacity="0.7"/>
      <rect y="0" width="35" height="45" rx="4" fill="#cc5500" opacity="0.65"/>
      <text x="17" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#fff">Scans</text>
      <text x="17" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#ffcc99">22 files</text>
    </g>

    <!-- Row 2: PDF file list -->
    <g transform="translate(20, 100)">
      <!-- File item 1 -->
      <rect width="240" height="18" rx="3" fill="#252538"/>
      <rect x="4" y="4" width="10" height="10" rx="2" fill="#ff6333"/>
      <text x="20" y="14" font-family="Arial, sans-serif" font-size="8" fill="#cccccc">invoice_jan_2024.pdf</text>
      <text x="200" y="14" font-family="Arial, sans-serif" font-size="7" fill="#888899">84 KB</text>
    </g>
    <g transform="translate(20, 122)">
      <rect width="240" height="18" rx="3" fill="#1e1e30"/>
      <rect x="4" y="4" width="10" height="10" rx="2" fill="#ff6333"/>
      <text x="20" y="14" font-family="Arial, sans-serif" font-size="8" fill="#cccccc">report_q1.pdf</text>
      <text x="200" y="14" font-family="Arial, sans-serif" font-size="7" fill="#888899">210 KB</text>
    </g>
    <g transform="translate(20, 144)">
      <rect width="240" height="18" rx="3" fill="#252538"/>
      <rect x="4" y="4" width="10" height="10" rx="2" fill="#ff6333"/>
      <text x="20" y="14" font-family="Arial, sans-serif" font-size="8" fill="#cccccc">contract_signed.pdf</text>
      <text x="200" y="14" font-family="Arial, sans-serif" font-size="7" fill="#888899">156 KB</text>
    </g>

    <!-- Laptop base -->
    <rect y="180" width="280" height="16" rx="0" fill="#2a2a42"/>
    <rect x="95" y="192" width="90" height="10" rx="5" fill="#222240"/>
  </g>

  <!-- Laptop hinge base -->
  <rect x="420" y="280" width="300" height="12" rx="6" fill="#222240"/>

  <!-- Cloud icon above laptop -->
  <g transform="translate(708, 95)">
    <ellipse cx="20" cy="22" rx="20" ry="16" fill="#333355"/>
    <ellipse cx="35" cy="25" rx="15" ry="12" fill="#333355"/>
    <ellipse cx="10" cy="26" rx="12" ry="10" fill="#333355"/>
    <rect x="5" y="22" width="45" height="14" rx="2" fill="#333355"/>
    <ellipse cx="20" cy="22" rx="18" ry="14" fill="#3d3d5c"/>
    <ellipse cx="33" cy="25" rx="13" ry="11" fill="#3d3d5c"/>
    <rect x="7" y="22" width="40" height="13" rx="2" fill="#3d3d5c"/>
    <!-- Cloud symbol lines -->
    <line x1="20" y1="20" x2="20" y2="32" stroke="#ff6333" stroke-width="2"/>
    <polygon points="14,24 20,16 26,24" fill="#ff6333"/>
  </g>

  <!-- Title -->
  <text x="400" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="#ffffff">Paper to Digital: Document Digitization</text>
  <text x="400" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#666688">Transform physical documents into searchable, organized digital files</text>
</svg>
