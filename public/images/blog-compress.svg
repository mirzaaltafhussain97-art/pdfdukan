<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <!-- Background -->
  <rect width="800" height="400" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="#ffffff">Image Compression: Quality vs. File Size</text>

  <!-- Center divider line -->
  <line x1="400" y1="55" x2="400" y2="370" stroke="#333355" stroke-width="2"/>
  <text x="400" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#ff6333">VS</text>

  <!-- ===== LEFT HALF: Original (heavy/large) ===== -->
  <!-- Background tint -->
  <rect x="0" y="55" width="398" height="345" fill="#1e1830" opacity="0.3"/>

  <!-- Large image box (heavy border) -->
  <g transform="translate(50, 85)">
    <!-- Heavy thick outer border (showing "weight") -->
    <rect x="-6" y="-6" width="252" height="232" rx="12" fill="#555577"/>
    <rect x="-3" y="-3" width="246" height="226" rx="10" fill="#3d3d60"/>
    <!-- Image content area -->
    <rect width="240" height="220" rx="8" fill="#2a2a42"/>

    <!-- Image content: same landscape scene -->
    <!-- Sky -->
    <rect x="0" y="0" width="240" height="100" rx="8" fill="#1e2855"/>
    <!-- Mountains (big, detailed) -->
    <polygon points="10,165 70,80 130,165" fill="#ff6333" opacity="0.9"/>
    <polygon points="70,165 130,110 190,165" fill="#ff9055" opacity="0.85"/>
    <polygon points="120,165 170,125 220,165" fill="#cc4400" opacity="0.8"/>
    <!-- Smaller mountain -->
    <polygon points="0,165 30,140 60,165" fill="#ff6333" opacity="0.5"/>
    <!-- Sun (large) -->
    <circle cx="195" cy="40" r="30" fill="#ffcc44" opacity="0.95"/>
    <!-- Sun rays -->
    <line x1="195" y1="5" x2="195" y2="15" stroke="#ffcc44" stroke-width="3" opacity="0.6"/>
    <line x1="195" y1="65" x2="195" y2="75" stroke="#ffcc44" stroke-width="3" opacity="0.6"/>
    <line x1="155" y1="40" x2="165" y2="40" stroke="#ffcc44" stroke-width="3" opacity="0.6"/>
    <line x1="225" y1="40" x2="235" y2="40" stroke="#ffcc44" stroke-width="3" opacity="0.6"/>
    <!-- Foreground ground -->
    <rect x="0" y="165" width="240" height="55" rx="0" fill="#1a2a1a"/>
    <rect x="0" y="165" width="240" height="55" rx="8" fill="#1a2a1a"/>

    <!-- "Pixel noise" dots to suggest uncompressed detail -->
    <circle cx="30" cy="60" r="1.5" fill="#ff9055" opacity="0.3"/>
    <circle cx="45" cy="55" r="1" fill="#ffcc44" opacity="0.3"/>
    <circle cx="60" cy="65" r="1.5" fill="#ff6333" opacity="0.2"/>
    <circle cx="80" cy="52" r="1" fill="#ff9055" opacity="0.3"/>
  </g>

  <!-- File size badge (prominent, heavy) -->
  <g transform="translate(50, 315)">
    <rect width="252" height="48" rx="8" fill="#333355"/>
    <rect x="1" y="1" width="250" height="46" rx="7" fill="none" stroke="#555577" stroke-width="2"/>
    <!-- Weight icon -->
    <text x="35" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#888899">⚖</text>
    <text x="160" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#cccccc">Original Size</text>
    <text x="160" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#ff9055">3.2 MB</text>
  </g>

  <!-- Left label -->
  <text x="175" y="376" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#888899">Full Resolution — Uncompressed</text>

  <!-- ===== RIGHT HALF: Compressed (light/small) ===== -->
  <!-- Background tint (slight green tint to show success) -->
  <rect x="402" y="55" width="398" height="345" fill="#181e18" opacity="0.3"/>

  <!-- Small image box (thin border — lightweight) -->
  <g transform="translate(470, 105)">
    <!-- Thin border -->
    <rect x="2" y="2" width="196" height="182" rx="8" fill="#0d0d1a" opacity="0.4"/>
    <!-- Image content area (smaller) -->
    <rect width="196" height="180" rx="8" fill="#2a2a42"/>

    <!-- Same scene, same quality visually -->
    <rect x="0" y="0" width="196" height="82" rx="8" fill="#1e2855"/>
    <!-- Mountains -->
    <polygon points="8,136 58,65 108,136" fill="#ff6333" opacity="0.9"/>
    <polygon points="58,136 105,90 152,136" fill="#ff9055" opacity="0.85"/>
    <polygon points="98,136 140,102 182,136" fill="#cc4400" opacity="0.8"/>
    <polygon points="0,136 24,114 48,136" fill="#ff6333" opacity="0.5"/>
    <!-- Sun -->
    <circle cx="162" cy="32" r="22" fill="#ffcc44" opacity="0.95"/>
    <!-- Foreground -->
    <rect x="0" y="136" width="196" height="44" rx="8" fill="#1a2a1a"/>

    <!-- Clean, no noise pixels = compressed -->
    <!-- Thin clean border -->
    <rect width="196" height="180" rx="8" fill="none" stroke="#445544" stroke-width="1.5"/>
  </g>

  <!-- File size badge (success, green accent) -->
  <g transform="translate(452, 315)">
    <rect width="280" height="48" rx="8" fill="#1a2e1a"/>
    <rect x="1" y="1" width="278" height="46" rx="7" fill="none" stroke="#448844" stroke-width="1.5"/>
    <!-- Featherweight icon -->
    <text x="35" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#44cc44">✦</text>
    <text x="175" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#cccccc">Compressed Size</text>
    <text x="175" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#ff6333">220 KB</text>
    <!-- Checkmark badge -->
    <circle cx="255" cy="24" r="18" fill="#ff6333"/>
    <polyline points="246,24 252,30 265,17" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right label -->
  <text x="605" y="376" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#888899">Compressed — 93% smaller, same visual quality</text>

  <!-- Savings callout -->
  <g transform="translate(335, 205)">
    <rect x="-3" y="-3" width="136" height="56" rx="10" fill="#ff6333" opacity="0.15"/>
    <rect width="130" height="50" rx="8" fill="none" stroke="#ff6333" stroke-width="1.5"/>
    <text x="65" y="16" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ff9055">File reduction</text>
    <text x="65" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#ff6333">93% less</text>
    <text x="65" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#888899">3.2 MB → 220 KB</text>
  </g>
</svg>
