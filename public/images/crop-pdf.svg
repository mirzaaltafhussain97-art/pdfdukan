<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">Crop a selected region from a PDF page</title>
  <desc id="desc">A PDF page with a highlighted crop rectangle, corner handles, and an exported image preview.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff7f2"/><stop offset="1" stop-color="#ffe5d8"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff6333"/><stop offset="1" stop-color="#ff9055"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".14"/></filter>
  </defs>
  <rect width="640" height="420" rx="28" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <path d="M88 48h246l58 58v264H88z" fill="#fff" stroke="#e8d8cf" stroke-width="3"/>
    <path d="M334 48v58h58" fill="#ffe0d2" stroke="#e8d8cf" stroke-width="3"/>
  </g>
  <g stroke="#ddc8bd" stroke-width="10" stroke-linecap="round"><path d="M130 137h196"/><path d="M130 170h150"/><path d="M130 303h210"/><path d="M130 335h160"/></g>
  <rect x="139" y="202" width="191" height="76" rx="5" fill="#fff2ec" stroke="#ff6333" stroke-width="4" stroke-dasharray="10 7"/>
  <g fill="#fff" stroke="#ff6333" stroke-width="4"><circle cx="139" cy="202" r="9"/><circle cx="330" cy="202" r="9"/><circle cx="139" cy="278" r="9"/><circle cx="330" cy="278" r="9"/></g>
  <path d="M350 240h71" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/><path d="M406 222l22 18-22 18" fill="none" stroke="#ff6333" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#shadow)"><rect x="442" y="145" width="150" height="190" rx="16" fill="#fff" stroke="#e8d8cf" stroke-width="3"/><rect x="462" y="183" width="110" height="74" rx="8" fill="#fff2ec" stroke="#ff6333" stroke-width="3"/><path d="M464 289h106" stroke="#ddc8bd" stroke-width="9" stroke-linecap="round"/></g>
  <circle cx="517" cy="108" r="32" fill="url(#accent)"/><path d="M501 108h32M517 92v32" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
</svg>
