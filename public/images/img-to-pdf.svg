<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300">
  <!-- Background -->
  <rect width="500" height="300" fill="#1e1e30"/>

  <!-- Image file icons (left side, stacked) -->
  <!-- Back card (third) -->
  <g transform="translate(28, 65) rotate(-8)">
    <rect x="4" y="4" width="110" height="130" rx="6" fill="#0d0d1a" opacity="0.4"/>
    <rect width="110" height="130" rx="6" fill="#2a2a42"/>
    <rect width="110" height="130" rx="6" fill="none" stroke="#444466" stroke-width="1"/>
    <rect x="0" y="90" width="110" height="40" fill="#222240"/>
    <rect x="0" y="90" width="110" height="40" rx="6" fill="#222240"/>
    <text x="55" y="113" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#888899">JPG</text>
  </g>

  <!-- Middle card (second) -->
  <g transform="translate(38, 55) rotate(-3)">
    <rect x="4" y="4" width="110" height="130" rx="6" fill="#0d0d1a" opacity="0.4"/>
    <rect width="110" height="130" rx="6" fill="#2d2d45"/>
    <rect width="110" height="130" rx="6" fill="none" stroke="#555577" stroke-width="1"/>
    <!-- Mini landscape thumbnail -->
    <rect x="10" y="15" width="90" height="60" rx="4" fill="#1a1a2e"/>
    <rect x="10" y="50" width="90" height="25" rx="0" fill="#ff9055" opacity="0.4"/>
    <rect x="10" y="50" width="90" height="25" rx="4" fill="#ff9055" opacity="0.4"/>
    <!-- Mountains -->
    <polygon points="20,75 45,42 70,75" fill="#ff6333" opacity="0.7"/>
    <polygon points="50,75 72,50 94,75" fill="#ff9055" opacity="0.6"/>
    <!-- Sun -->
    <circle cx="80" cy="28" r="8" fill="#ffbb44" opacity="0.9"/>
    <rect x="10" y="90" width="90" height="30" rx="4" fill="#222240"/>
    <text x="55" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#888899">JPG</text>
  </g>

  <!-- Front card (first) -->
  <g transform="translate(48, 45)">
    <rect x="4" y="4" width="110" height="130" rx="6" fill="#0d0d1a" opacity="0.5"/>
    <rect width="110" height="130" rx="6" fill="#333355"/>
    <!-- Thumbnail area -->
    <rect x="10" y="15" width="90" height="65" rx="4" fill="#1a1a2e"/>
    <!-- Sky gradient simulation -->
    <rect x="10" y="15" width="90" height="30" rx="4" fill="#1e3060"/>
    <!-- Mountains -->
    <polygon points="15,80 45,38 75,80" fill="#ff6333" opacity="0.85"/>
    <polygon points="45,80 70,48 95,80" fill="#ff9055" opacity="0.75"/>
    <polygon points="55,80 80,55 100,80" fill="#ff6333" opacity="0.5"/>
    <!-- Sun -->
    <circle cx="85" cy="28" r="9" fill="#ffcc44" opacity="0.95"/>
    <!-- Label area -->
    <rect x="0" y="92" width="110" height="38" rx="0" fill="#2a2a42"/>
    <rect x="0" y="92" width="110" height="38" rx="6" fill="#2a2a42"/>
    <!-- File label -->
    <rect x="8" y="99" width="38" height="18" rx="3" fill="#ff9055"/>
    <text x="27" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="#ffffff">JPG</text>
    <rect x="52" y="104" width="50" height="4" rx="2" fill="#555577"/>
    <rect x="52" y="113" width="38" height="4" rx="2" fill="#444466"/>
    <!-- File size -->
    <text x="55" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#888899">2 Images</text>
  </g>

  <!-- Large Orange Arrow -->
  <g transform="translate(200, 120)">
    <polygon points="0,25 60,25 60,10 90,40 60,70 60,55 0,55" fill="#ff6333" opacity="0.95"/>
  </g>

  <!-- PDF Document icon (right side) -->
  <g transform="translate(320, 65)">
    <!-- Shadow -->
    <rect x="6" y="6" width="130" height="165" rx="8" fill="#0d0d1a" opacity="0.5"/>
    <!-- Document body -->
    <rect width="130" height="165" rx="8" fill="#f8f8f8"/>
    <!-- Fold corner -->
    <polygon points="92,0 130,0 130,38" fill="#ddd"/>
    <polygon points="92,0 92,38 130,38" fill="#ececec"/>
    <!-- Red/orange header bar -->
    <rect y="45" width="130" height="38" fill="#ff6333"/>
    <!-- PDF text -->
    <text x="65" y="71" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="22" fill="#ffffff">PDF</text>
    <!-- Text lines -->
    <rect x="14" y="96" width="102" height="7" rx="3" fill="#dddddd"/>
    <rect x="14" y="110" width="90" height="7" rx="3" fill="#e5e5e5"/>
    <rect x="14" y="124" width="102" height="7" rx="3" fill="#dddddd"/>
    <rect x="14" y="138" width="70" height="7" rx="3" fill="#e5e5e5"/>
  </g>

  <!-- Label text below -->
  <text x="100" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#888899">Images</text>
  <text x="380" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#888899">PDF File</text>

  <!-- Title -->
  <text x="250" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="17" fill="#ffffff">Image to PDF Converter</text>
  <text x="250" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666688">Convert JPG, PNG, WebP images into a single PDF</text>
</svg>
