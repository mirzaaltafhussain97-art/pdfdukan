<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">PDF pages converted to JPG images</title>
  <desc id="desc">A three-page PDF is rendered into separate numbered image files with resolution controls.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff1f2"/><stop offset="1" stop-color="#fff7ed"/></linearGradient><linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dc2626"/><stop offset="1" stop-color="#fb7185"/></linearGradient><filter id="s"><feDropShadow dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity=".14"/></filter></defs>
  <rect width="720" height="420" rx="28" fill="url(#bg)"/><text x="360" y="45" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#0f172a">Render selected PDF pages as images</text>
  <g transform="translate(68 92)" filter="url(#s)"><rect width="190" height="245" rx="18" fill="#fff"/><path d="M0 18A18 18 0 0 1 18 0h154a18 18 0 0 1 18 18v52H0z" fill="url(#red)"/><text x="95" y="46" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#fff">PDF</text><g font-family="Arial,sans-serif" font-weight="700" font-size="15" fill="#334155"><rect x="24" y="94" width="142" height="34" rx="8" fill="#fee2e2"/><text x="95" y="117" text-anchor="middle">Page 1</text><rect x="24" y="143" width="142" height="34" rx="8" fill="#fee2e2"/><text x="95" y="166" text-anchor="middle">Page 2</text><rect x="24" y="192" width="142" height="34" rx="8" fill="#fee2e2"/><text x="95" y="215" text-anchor="middle">Page 3</text></g></g>
  <g transform="translate(290 170)"><circle cx="46" cy="46" r="44" fill="#fff" stroke="#f97316" stroke-width="3"/><path d="M20 46h48m-12-13 14 13-14 13" fill="none" stroke="#f97316" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g transform="translate(405 75)" filter="url(#s)" font-family="Arial,sans-serif"><g transform="rotate(-4 75 120)"><rect width="150" height="190" rx="14" fill="#fff" stroke="#fecaca"/><rect x="14" y="14" width="122" height="105" rx="9" fill="#ffe4e6"/><circle cx="48" cy="47" r="17" fill="#fb7185"/><path d="m23 101 34-34 23 23 21-22 35 33" fill="none" stroke="#e11d48" stroke-width="7" stroke-linejoin="round"/><text x="75" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">page_001.jpg</text><text x="75" y="172" text-anchor="middle" font-size="12" fill="#64748b">200 DPI</text></g><g transform="translate(150 30) rotate(5 75 120)"><rect width="150" height="190" rx="14" fill="#fff" stroke="#fed7aa"/><rect x="14" y="14" width="122" height="105" rx="9" fill="#ffedd5"/><circle cx="48" cy="47" r="17" fill="#fb923c"/><path d="m23 101 34-34 23 23 21-22 35 33" fill="none" stroke="#ea580c" stroke-width="7" stroke-linejoin="round"/><text x="75" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">page_002.png</text><text x="75" y="172" text-anchor="middle" font-size="12" fill="#64748b">lossless pixels</text></g></g>
  <g transform="translate(404 337)" font-family="Arial,sans-serif" font-size="13" fill="#475569"><rect width="242" height="38" rx="19" fill="#fff" stroke="#fed7aa"/><text x="121" y="24" text-anchor="middle">JPG · PNG · WebP · ZIP</text></g>
</svg>
