<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">HTML code turning into a paginated A4 PDF with clickable links</title>
<rect width="640" height="420" rx="24" fill="#e7f6f4"/>
<g transform="translate(40 70)">
<rect width="240" height="270" rx="14" fill="#0f2a2a"/>
<g fill="#ffffff"><circle cx="20" cy="20" r="5" fill="#f87171"/><circle cx="36" cy="20" r="5" fill="#fbbf24"/><circle cx="52" cy="20" r="5" fill="#34d399"/></g>
<g font-family="Consolas,monospace" font-size="15">
<text x="20" y="62" fill="#5eead4">&lt;html&gt;</text>
<text x="36" y="90" fill="#93c5fd">&lt;h1&gt;<tspan fill="#e2e8f0">Invoice</tspan>&lt;/h1&gt;</text>
<text x="36" y="118" fill="#93c5fd">&lt;table&gt;</text>
<text x="52" y="146" fill="#93c5fd">&lt;tr&gt;<tspan fill="#e2e8f0">…</tspan>&lt;/tr&gt;</text>
<text x="36" y="174" fill="#93c5fd">&lt;/table&gt;</text>
<text x="36" y="202" fill="#93c5fd">&lt;a <tspan fill="#fca5a5">href</tspan>=…&gt;</text>
<text x="20" y="230" fill="#5eead4">&lt;/html&gt;</text>
</g>
</g>
<g transform="translate(300 190)"><circle r="26" fill="#14b8a6"/><path d="M-10 0h18m-7-8 8 8-8 8" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
<g transform="translate(350 40)">
<rect x="22" y="22" width="200" height="280" rx="10" fill="#fff" stroke="#99d8cf" stroke-width="3"/>
<rect width="200" height="280" rx="10" fill="#fff" stroke="#0f766e" stroke-width="4"/>
<rect x="18" y="20" width="90" height="14" rx="7" fill="#0f766e"/>
<g fill="#cfe9e5"><rect x="18" y="54" width="164" height="18" rx="4" fill="#99d8cf"/><rect x="18" y="80" width="164" height="12" rx="3"/><rect x="18" y="100" width="164" height="12" rx="3"/><rect x="18" y="120" width="164" height="12" rx="3"/><rect x="18" y="140" width="164" height="12" rx="3"/></g>
<rect x="18" y="166" width="96" height="10" rx="5" fill="#2563eb"/>
<line x1="0" y1="200" x2="200" y2="200" stroke="#ff6333" stroke-width="3" stroke-dasharray="8 6"/>
<rect x="132" y="190" width="58" height="20" rx="6" fill="#ff6333"/><text x="161" y="205" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Page 2</text>
<g fill="#cfe9e5"><rect x="18" y="226" width="150" height="10" rx="3"/><rect x="18" y="244" width="120" height="10" rx="3"/></g>
<rect x="60" y="300" width="84" height="30" rx="8" fill="#0f766e"/><text x="102" y="321" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">A4 PDF</text>
</g>
