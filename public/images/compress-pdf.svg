<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">PDF compression size comparison</title>
  <desc id="desc">A large PDF page becomes a smaller PDF page with measured size bars and a downward arrow.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff7f2"/><stop offset="1" stop-color="#ffe5d8"/></linearGradient><linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c62828"/><stop offset="1" stop-color="#ef5350"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".14"/></filter></defs>
  <rect width="640" height="420" rx="28" fill="url(#bg)"/>
  <g filter="url(#s)"><path d="M70 54h222l53 53v258H70z" fill="#fff" stroke="#ead7ce" stroke-width="3"/><path d="M292 54v53h53" fill="#ffd8ca" stroke="#ead7ce" stroke-width="3"/></g>
  <rect x="104" y="139" width="177" height="93" rx="12" fill="#fff2ec"/><g stroke="#ddbfb1" stroke-width="10" stroke-linecap="round"><path d="M104 270h185"/><path d="M104 304h139"/></g><rect x="104" y="337" width="188" height="12" rx="6" fill="#ef5350"/>
  <path d="M374 179v72" stroke="url(#a)" stroke-width="13" stroke-linecap="round"/><path d="M345 230l29 30 29-30" fill="none" stroke="#d93b3b" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#s)"><path d="M435 119h130l35 35v169H435z" fill="#fff" stroke="#ead7ce" stroke-width="3"/><path d="M565 119v35h35" fill="#ffd8ca" stroke="#ead7ce" stroke-width="3"/></g>
  <rect x="458" y="183" width="116" height="61" rx="10" fill="#fff2ec"/><g stroke="#ddbfb1" stroke-width="8" stroke-linecap="round"><path d="M458 272h112"/><path d="M458 298h75"/></g><rect x="458" y="327" width="69" height="12" rx="6" fill="#43a047"/>
  <circle cx="374" cy="104" r="43" fill="url(#a)"/><path d="M374 82v42M354 107l20 20 20-20" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
