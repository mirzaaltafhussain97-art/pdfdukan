<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">A scanned page with an invisible OCR text layer being searched</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e3f2fd"/><stop offset="1" stop-color="#fff3e0"/></linearGradient>
    <linearGradient id="og" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6333"/><stop offset="1" stop-color="#ff9055"/></linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity=".16"/></filter>
  </defs>
  <rect width="640" height="420" rx="24" fill="url(#bg)"/>
  <!-- scanned page (slightly grey, speckled) -->
  <g filter="url(#sh)" transform="rotate(-3 210 210)">
    <rect x="100" y="60" width="220" height="300" rx="8" fill="#f5f2ec"/>
    <rect x="124" y="88" width="90" height="12" rx="3" fill="#5d5a55"/>
    <g fill="#8a857d">
      <rect x="124" y="118" width="170" height="7" rx="3"/><rect x="124" y="134" width="150" height="7" rx="3"/>
      <rect x="124" y="150" width="165" height="7" rx="3"/><rect x="124" y="166" width="120" height="7" rx="3"/>
      <rect x="124" y="192" width="168" height="7" rx="3"/><rect x="124" y="208" width="140" height="7" rx="3"/>
      <rect x="124" y="224" width="160" height="7" rx="3"/><rect x="124" y="250" width="150" height="7" rx="3"/>
      <rect x="124" y="266" width="110" height="7" rx="3"/>
    </g>
    <g fill="#b5afa5"><circle cx="270" cy="300" r="1.5"/><circle cx="150" cy="320" r="1.2"/><circle cx="300" cy="100" r="1.4"/><circle cx="200" cy="290" r="1"/></g>
  </g>
  <!-- arrow -->
  <path d="M338 210h44" stroke="#ff6333" stroke-width="6" stroke-linecap="round"/>
  <path d="M374 196l16 14-16 14" fill="none" stroke="#ff6333" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- searchable page with dashed text boxes -->
  <g filter="url(#sh)">
    <rect x="404" y="60" width="200" height="300" rx="8" fill="#fff"/>
    <rect x="424" y="86" width="84" height="12" rx="3" fill="#5d5a55"/>
    <g fill="#9aa0a6"><rect x="424" y="116" width="156" height="7" rx="3"/><rect x="424" y="148" width="150" height="7" rx="3"/><rect x="424" y="164" width="110" height="7" rx="3"/><rect x="424" y="196" width="152" height="7" rx="3"/><rect x="424" y="228" width="140" height="7" rx="3"/></g>
    <rect x="420" y="128" width="148" height="15" rx="3" fill="#ffe0b2" stroke="#ff6333" stroke-width="1.5"/>
    <rect x="424" y="132" width="138" height="7" rx="3" fill="#8a5a3c"/>
    <g fill="none" stroke="#29b6f6" stroke-width="1.4" stroke-dasharray="4 3"><rect x="420" y="111" width="164" height="17" rx="3"/><rect x="420" y="191" width="160" height="17" rx="3"/><rect x="420" y="223" width="148" height="17" rx="3"/></g>
    <rect x="424" y="292" width="64" height="24" rx="6" fill="url(#og)"/>
    <text x="456" y="309" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">OCR</text>
  </g>
  <!-- search bar -->
  <g filter="url(#sh)">
    <rect x="360" y="20" width="214" height="34" rx="17" fill="#fff"/>
    <circle cx="382" cy="37" r="7" fill="none" stroke="#0277bd" stroke-width="2.5"/><path d="M387 42l6 6" stroke="#0277bd" stroke-width="2.5" stroke-linecap="round"/>
    <text x="402" y="42" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#333">invoice number</text>
    <text x="560" y="42" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#16a34a" text-anchor="end">1 of 3</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
