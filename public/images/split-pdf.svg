<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Split PDF page ranges illustration</title>
  <desc id="desc">A six-page PDF separated into three clearly labelled page-range files.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e6fffb"/><stop offset="1" stop-color="#fff7ed"/></linearGradient>
    <linearGradient id="doc" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00838f"/><stop offset="1" stop-color="#26c6da"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity=".13"/></filter>
  </defs>
  <rect width="720" height="420" rx="28" fill="url(#bg)"/>
  <text x="360" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Choose exact PDF page groups</text>
  <g transform="translate(55 78)" filter="url(#shadow)">
    <rect width="164" height="250" rx="18" fill="#fff"/><rect width="164" height="55" rx="18" fill="url(#doc)"/><rect y="37" width="164" height="18" fill="url(#doc)"/>
    <text x="82" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff">Original PDF</text>
    <g font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">
      <g transform="translate(18 76)"><rect width="54" height="65" rx="7" fill="#ecfeff" stroke="#67e8f9"/><text x="27" y="38" text-anchor="middle">1</text></g>
      <g transform="translate(90 76)"><rect width="54" height="65" rx="7" fill="#ecfeff" stroke="#67e8f9"/><text x="27" y="38" text-anchor="middle">2</text></g>
      <g transform="translate(18 157)"><rect width="54" height="65" rx="7" fill="#ecfeff" stroke="#67e8f9"/><text x="27" y="38" text-anchor="middle">3</text></g>
      <g transform="translate(90 157)"><rect width="54" height="65" rx="7" fill="#ecfeff" stroke="#67e8f9"/><text x="27" y="38" text-anchor="middle">4–6</text></g>
    </g>
  </g>
  <g transform="translate(247 180)"><circle cx="40" cy="40" r="38" fill="#fff" stroke="#f97316" stroke-width="3"/><text x="40" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="32">✂</text></g>
  <path d="M326 220h52" stroke="#f97316" stroke-width="5" stroke-linecap="round"/><path d="m369 209 14 11-14 11" fill="none" stroke="#f97316" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(405 72)" font-family="Arial, sans-serif" filter="url(#shadow)">
    <g><rect width="250" height="82" rx="15" fill="#fff"/><rect width="62" height="82" rx="15" fill="#00838f"/><rect x="47" width="15" height="82" fill="#00838f"/><text x="31" y="50" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">1–2</text><text x="82" y="34" font-size="15" font-weight="700" fill="#0f172a">pages_001-002.pdf</text><text x="82" y="58" font-size="13" fill="#64748b">2 pages</text></g>
    <g transform="translate(0 105)"><rect width="250" height="82" rx="15" fill="#fff"/><rect width="62" height="82" rx="15" fill="#0f766e"/><rect x="47" width="15" height="82" fill="#0f766e"/><text x="31" y="50" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">3</text><text x="82" y="34" font-size="15" font-weight="700" fill="#0f172a">page_003.pdf</text><text x="82" y="58" font-size="13" fill="#64748b">1 page</text></g>
    <g transform="translate(0 210)"><rect width="250" height="82" rx="15" fill="#fff"/><rect width="62" height="82" rx="15" fill="#115e59"/><rect x="47" width="15" height="82" fill="#115e59"/><text x="31" y="50" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">4–6</text><text x="82" y="34" font-size="15" font-weight="700" fill="#0f172a">pages_004-006.pdf</text><text x="82" y="58" font-size="13" fill="#64748b">3 pages</text></g>
  </g>
  <text x="360" y="389" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#475569">Separate PDFs + one ZIP when several parts are created</text>
</svg>
