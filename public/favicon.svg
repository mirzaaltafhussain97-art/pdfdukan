<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6333"/>
      <stop offset="100%" stop-color="#ff9055"/>
    </linearGradient>
  </defs>
  <!-- Rounded background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Document icon (white) -->
  <rect x="8" y="5" width="11" height="15" rx="1.5" fill="white" fill-opacity="0.95"/>
  <!-- Dog-ear fold -->
  <path d="M15 5L19 9H15Z" fill="#ff6333" fill-opacity="0.55"/>
  <!-- Text lines on document -->
  <rect x="10" y="11" width="6" height="1.3" rx="0.65" fill="#ff6333" fill-opacity="0.7"/>
  <rect x="10" y="13.5" width="7.5" height="1.3" rx="0.65" fill="#ff6333" fill-opacity="0.7"/>
  <rect x="10" y="16" width="4.5" height="1.3" rx="0.65" fill="#ff6333" fill-opacity="0.7"/>
  <!-- Camera viewfinder (scanner indicator) -->
  <circle cx="22" cy="23" r="5.5" fill="#ff6333"/>
  <circle cx="22" cy="23" r="3.4" fill="none" stroke="white" stroke-width="1.3"/>
  <circle cx="22" cy="23" r="1.5" fill="white"/>
  <!-- Corner brackets top-left -->
  <path d="M4 8L4 5L7 5" fill="none" stroke="white" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <!-- Corner bracket bottom-right -->
  <path d="M28 24L28 27L25 27" fill="none" stroke="white" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
</svg>
